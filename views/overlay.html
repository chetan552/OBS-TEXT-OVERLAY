<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>OBS Text Overlay</title>
  <!--TP_CONFIG-->

  <!--
  ===========================================================================
  OBS OVERLAY PAGE
  ===========================================================================
  Add this page to OBS Studio as a "Browser" source.

  How to add in OBS:
    1. In OBS, click the "+" button in the "Sources" panel.
    2. Choose "Browser".
    3. Name it (e.g. "Text Overlay") and click OK.
    4. Set URL to:  http://localhost:3001/overlay.html
    5. Set Width to 1920 and Height to 1080.
    6. Check "Refresh browser when scene becomes active" (optional).
    7. Click OK.

  The page connects to the WebSocket server and displays text inside a
  styled bar.  The background is transparent so only the bar is visible on
  your stream.

  APPEARANCE
  ----------
  Every visual property below is driven by a CSS custom property that the
  channel's theme sets at runtime (see public/theme-apply.js).  Edit the
  design at /c/<channel>/design — changes reach this page live over the
  WebSocket, so OBS updates without a refresh.

  The :root values here are the defaults, and are also what the design
  page's "Reset to default" restores.
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap"
    rel="stylesheet"
  />
  <script src="/theme-apply.js"></script>

  <style>
    /* ---- Theme variables (defaults = the original design) ---------------- */
    :root {
      --tp-font: Lato, sans-serif;
      --tp-font-size: 44px;
      --tp-font-weight: 400;
      --tp-text-color: #ffffff;
      --tp-text-transform: none;
      --tp-letter-spacing: 0px;

      --tp-bar-color: rgba(43, 64, 78, 0.9);
      --tp-bar-height: 100px;
      --tp-bar-max-width: 900px;
      --tp-pad-left: 40px;
      --tp-pad-right: 64px;
      --tp-radius: 0px;
      --tp-clip: polygon(100% 0, calc(100% - 24px) 50%, 100% 100%, 0 100%, 0 0);

      --tp-top: 0px;
      --tp-bottom: auto;
      --tp-left: 0px;
      --tp-right: auto;
      --tp-translate-y: 0;

      --tp-anim-ms: 300ms;
    }

    /* ---- Reset & base ---------------------------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      /* Transparent background — critical for OBS overlay */
      background-color: rgba(0, 0, 0, 0) !important;
      font-family: var(--tp-font);
      line-height: 1.5;
    }

    /* ---- Overlay bar wrapper (handles the reveal animation) ----------------
       |
       |  Positioned by the theme's placement variables. The reveal style is
       |  selected by data-tp-anim on <html>:
       |
       |    slide  transitions max-width 0 → bar-max-width, so the bar wipes
       |           in from its anchored edge. Needs overflow hidden.
       |    fade   transitions opacity, and must NOT clip.
       |    none   appears instantly.
       |  ----------------------------------------------------------------- */
    .overlay-bar-wrapper {
      position: fixed;
      top: var(--tp-top);
      bottom: var(--tp-bottom);
      left: var(--tp-left);
      right: var(--tp-right);
      transform: translateY(var(--tp-translate-y));
    }

    /* Slide (default) */
    [data-tp-anim="slide"] .overlay-bar-wrapper,
    :root:not([data-tp-anim]) .overlay-bar-wrapper {
      overflow: hidden;
      max-width: 0;
      -webkit-transition: max-width var(--tp-anim-ms) cubic-bezier(0.4, 0, 0.2, 1);
      transition: max-width var(--tp-anim-ms) cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-tp-anim="slide"] .overlay-bar-wrapper.visible,
    :root:not([data-tp-anim]) .overlay-bar-wrapper.visible {
      max-width: var(--tp-bar-max-width);
    }

    /* A right-anchored bar should wipe in from the right edge, so the inner
       bar is pushed to the wrapper's right while the wrapper is narrow. */
    [data-tp-side="right"] .overlay-bar-wrapper {
      display: flex;
      justify-content: flex-end;
    }

    /* Fade */
    [data-tp-anim="fade"] .overlay-bar-wrapper {
      max-width: var(--tp-bar-max-width);
      opacity: 0;
      -webkit-transition: opacity var(--tp-anim-ms) ease-out;
      transition: opacity var(--tp-anim-ms) ease-out;
    }

    [data-tp-anim="fade"] .overlay-bar-wrapper.visible {
      opacity: 1;
    }

    /* None */
    [data-tp-anim="none"] .overlay-bar-wrapper {
      max-width: var(--tp-bar-max-width);
      visibility: hidden;
    }

    [data-tp-anim="none"] .overlay-bar-wrapper.visible {
      visibility: visible;
    }

    /* ---- The bar itself -------------------------------------------------- */
    .overlay-bar {
      display: -webkit-box;
      display: -webkit-flex;
      display: -ms-flexbox;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      width: -webkit-max-content;
      width: max-content;
      max-width: var(--tp-bar-max-width);
      height: var(--tp-bar-height);
      color: var(--tp-text-color);
      background: var(--tp-bar-color);
      padding: 0 var(--tp-pad-right) 0 var(--tp-pad-left);
      border-radius: var(--tp-radius);
      white-space: nowrap;
      -webkit-clip-path: var(--tp-clip);
      clip-path: var(--tp-clip);
    }

    /* A right-anchored bar mirrors its padding so the wider side stays on
       the angled edge. */
    [data-tp-side="right"] .overlay-bar {
      padding: 0 var(--tp-pad-left) 0 var(--tp-pad-right);
    }

    /* ---- The text -------------------------------------------------------- */
    .overlay-text {
      margin: 0;
      font-size: var(--tp-font-size);
      font-weight: var(--tp-font-weight);
      font-family: var(--tp-font);
      text-transform: var(--tp-text-transform);
      letter-spacing: var(--tp-letter-spacing);
      line-height: var(--tp-bar-height); /* vertically centers single-line text */
      color: var(--tp-text-color);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---- Debug indicator (small dot in corner — off-screen in OBS) ------- */
    .debug-status {
      position: fixed;
      bottom: 4px;
      right: 8px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      font-family: monospace;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

  <!-- Overlay bar — slides in from the left when text is received -->
  <div id="overlayBarWrapper" class="overlay-bar-wrapper">
    <div class="overlay-bar">
      <h3 id="overlayText" class="overlay-text"></h3>
    </div>
  </div>

  <!-- Debug status (only visible when opened in a regular browser) -->
  <div id="debugStatus" class="debug-status"></div>

  <!-- ========================================================================= -->
  <!-- WebSocket client script                                                   -->
  <!-- ========================================================================= -->
  <script>
    (function () {
      // ---- Configuration ----------------------------------------------------
      // The server injects window.__TP__ with this page's channel and the
      // WebSocket path carrying its view token. The token is what scopes this
      // overlay to one church — without it the connection is refused.
      const config = window.__TP__ || {};
      const SERVER_URL =
        `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}${config.wsUrl}`;

      // DOM elements
      const wrapperEl = document.getElementById("overlayBarWrapper");
      const textEl = document.getElementById("overlayText");
      const debugEl = document.getElementById("debugStatus");

      // ---- WebSocket connection ---------------------------------------------
      let socket = null;
      let reconnectTimer = null;
      let reconnectDelay = 1000;

      function debug(label) {
        debugEl.textContent = label;
        console.log("[overlay]", label);
      }

      function connect() {
        if (socket) {
          socket.onclose = null;
          socket.close();
          socket = null;
        }

        debug("Connecting…");
        socket = new WebSocket(SERVER_URL);

        socket.addEventListener("open", () => {
          debug("Connected");
          reconnectDelay = 1000;
        });

        // The server speaks JSON envelopes: text updates and theme updates
        // arrive on the same socket, so a design change reaches OBS live
        // without anyone touching the Browser Source.
        socket.addEventListener("message", (event) => {
          let message;
          try {
            message = JSON.parse(event.data);
          } catch {
            return; // Ignore anything that isn't a well-formed envelope
          }

          if (message.type === "theme") {
            TPTheme.applyOverlay(document.documentElement, message.theme.overlay);
            return;
          }

          if (message.type !== "text") return;

          if (message.text === "") {
            // Empty string means "clear the overlay" — collapse the bar
            textEl.textContent = "";
            wrapperEl.classList.remove("visible");
            return;
          }

          // ---- Safely escape text to prevent HTML/JS injection --------------
          // Set via textContent so user input is NEVER parsed as HTML.
          // For multi-line text we replace newlines with a " | " separator
          // since the bar is single-line by design.
          textEl.textContent = message.text.replace(/\n/g, "  |  ");

          // Expand the bar
          wrapperEl.classList.add("visible");
        });

        socket.addEventListener("close", () => {
          debug("Disconnected — retrying…");
          scheduleReconnect();
        });

        socket.addEventListener("error", (err) => {
          console.error("[overlay] WebSocket error:", err);
        });
      }

      function scheduleReconnect() {
        if (reconnectTimer) return;
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          reconnectDelay = Math.min(reconnectDelay * 2, 30000);
          connect();
        }, reconnectDelay);
      }

      // ---- Initialize ------------------------------------------------------
      connect();
    })();
  </script>
</body>
</html>
