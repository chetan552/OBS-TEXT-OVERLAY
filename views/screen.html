<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Presentation Screen</title>
  <!--TP_CONFIG-->

  <!--
  ===========================================================================
  PRESENTATION SCREEN PAGE
  ===========================================================================
  Open this page on a second monitor, projector, or any screen you want
  your audience to see.  It fills the entire viewport with a dark navy
  background and displays the text from the control page, centered and
  in large uppercase type.

  URL:  http://localhost:3001/screen.html

  This page connects to the same WebSocket server as the OBS overlay,
  so whatever you type on the control page appears here instantly.
  -->

  <!--
  APPEARANCE
  ----------
  Every visual property is driven by a CSS custom property that the channel's
  theme sets at runtime (see public/theme-apply.js).  Edit the design at
  /c/<channel>/design — changes arrive live over the WebSocket, so the
  projector updates without a refresh.

  The :root values below are the defaults, and are what the design page's
  "Reset to default" restores.
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <script src="/theme-apply.js"></script>

  <style>
    /* ---- Theme variables (defaults = the original design) ---------------- */
    :root {
      --tp-screen-font: "PT Sans Narrow", sans-serif;
      --tp-screen-size: 8vw;
      --tp-screen-weight: 700;
      --tp-screen-color: #ffffff;
      --tp-screen-transform: uppercase;
      --tp-screen-spacing: 0.25rem;
      --tp-screen-line: 1.167;
      --tp-screen-bg: #2b404e;
      --tp-screen-pad: 64px;
      --tp-screen-text-align: center;
      --tp-screen-justify: center;
      --tp-screen-align: center;
      --tp-screen-fade: 500ms;
    }

    /* ---- Reset & base ---------------------------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-text-size-adjust: 100%;
    }

    strong, b {
      font-weight: 700;
    }

    body {
      margin: 0;
      color: var(--tp-screen-color);
      font-size: 1.125rem;
      font-weight: 400;
      font-family: var(--tp-screen-font);
      line-height: 1.5;
      /* Fills the entire screen; matches the container so no seam shows
         during a resize. */
      background-color: var(--tp-screen-bg);
    }

    /* ---- Full-screen centered container ------------------------------------
       |
       |  Covers the entire viewport.  Flexbox centers the text both
       |  horizontally and vertically.  Padding keeps text away from edges.
       |  ----------------------------------------------------------------- */
    .screen-container {
      display: -webkit-box;
      display: -webkit-flex;
      display: -ms-flexbox;
      display: flex;
      -webkit-flex-direction: column;
      -ms-flex-direction: column;
      flex-direction: column;
      -webkit-box-pack: center;
      -ms-flex-pack: center;
      -webkit-justify-content: var(--tp-screen-justify);
      justify-content: var(--tp-screen-justify);
      -webkit-box-align: center;
      -ms-flex-align: center;
      -webkit-align-items: var(--tp-screen-align);
      align-items: var(--tp-screen-align);
      text-align: var(--tp-screen-text-align);
      color: var(--tp-screen-color);
      background-color: var(--tp-screen-bg);
      position: absolute;
      padding: var(--tp-screen-pad);
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
    }

    /* ---- The display text ------------------------------------------------ */
    .screen-text {
      margin: 0;
      font-family: var(--tp-screen-font);
      font-size: var(--tp-screen-size);
      font-weight: var(--tp-screen-weight);
      color: var(--tp-screen-color);
      text-transform: var(--tp-screen-transform);
      letter-spacing: var(--tp-screen-spacing);
      line-height: var(--tp-screen-line);
      /* Fade in when text changes */
      opacity: 0;
      -webkit-transition: opacity var(--tp-screen-fade) ease-out;
      transition: opacity var(--tp-screen-fade) ease-out;
    }

    .screen-text.visible {
      opacity: 1;
    }

    /* ---- Debug indicator (small dot in corner) --------------------------- */
    .debug-status {
      position: fixed;
      bottom: 4px;
      right: 8px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      font-family: monospace;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

  <!-- Full-screen centered container -->
  <div class="screen-container">
    <h1 id="screenText" class="screen-text"></h1>
  </div>

  <!-- Debug status -->
  <div id="debugStatus" class="debug-status"></div>

  <!-- ========================================================================= -->
  <!-- WebSocket client script                                                   -->
  <!-- ========================================================================= -->
  <script>
    (function () {
      // ---- Configuration ----------------------------------------------------
      // window.__TP__ is injected by the server and carries this page's view
      // token, which scopes the connection to a single church's channel.
      const config = window.__TP__ || {};
      const SERVER_URL =
        `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}${config.wsUrl}`;

      // DOM elements
      const textEl = document.getElementById("screenText");
      const debugEl = document.getElementById("debugStatus");

      // ---- WebSocket connection ---------------------------------------------
      let socket = null;
      let reconnectTimer = null;
      let reconnectDelay = 1000;

      function debug(label) {
        debugEl.textContent = label;
        console.log("[screen]", label);
      }

      function connect() {
        if (socket) {
          socket.onclose = null;
          socket.close();
          socket = null;
        }

        debug("Connecting…");
        socket = new WebSocket(SERVER_URL);

        socket.addEventListener("open", () => {
          debug("Connected");
          reconnectDelay = 1000;
        });

        // Text and theme updates share one socket, so a design change reaches
        // the projector live without a refresh.
        socket.addEventListener("message", (event) => {
          let message;
          try {
            message = JSON.parse(event.data);
          } catch {
            return; // Ignore anything that isn't a well-formed envelope
          }

          if (message.type === "theme") {
            TPTheme.applyScreen(document.documentElement, message.theme.screen);
            return;
          }

          if (message.type !== "text") return;

          if (message.text === "") {
            // Empty string = clear the screen
            textEl.textContent = "";
            textEl.classList.remove("visible");
            return;
          }

          // Safely set text (textContent prevents HTML/JS injection)
          textEl.textContent = message.text;

          // Trigger fade-in
          // Force a reflow so the transition retriggers even if the
          // text is the same as before
          textEl.classList.remove("visible");
          void textEl.offsetWidth; // force reflow
          textEl.classList.add("visible");
        });

        socket.addEventListener("close", () => {
          debug("Disconnected — retrying…");
          scheduleReconnect();
        });

        socket.addEventListener("error", (err) => {
          console.error("[screen] WebSocket error:", err);
        });
      }

      function scheduleReconnect() {
        if (reconnectTimer) return;
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          reconnectDelay = Math.min(reconnectDelay * 2, 30000);
          connect();
        }, reconnectDelay);
      }

      // ---- Initialize ------------------------------------------------------
      connect();
    })();
  </script>
</body>
</html>
