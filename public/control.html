<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBS Text Overlay — Control</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="control-page">

  <!--
  ===========================================================================
  CONTROL PAGE
  ===========================================================================
  Open this page in your regular browser.  Type text and press Enter to send
  it to the WebSocket server.  The server then broadcasts it to every
  connected overlay page (which you've added as a Browser Source in OBS).

  The connection-status badge in the top-right corner tells you whether the
  WebSocket is alive.
  -->

  <div class="control-container">
    <h1>OBS Text Overlay</h1>
    <p class="subtitle">Type your text below and press <kbd>Enter</kbd> to send it to the overlay.</p>

    <!-- Connection status badge -->
    <div id="status" class="status disconnected">Disconnected</div>

    <!-- Text input with Bible-book autocomplete -->
    <div class="input-wrapper">
      <input
        type="text"
        id="textInput"
        class="text-input"
        placeholder="e.g. John 3:16 …"
        autocomplete="off"
        autofocus
      />
      <!-- Autocomplete suggestions are injected here as the user types a book -->
      <div id="autocomplete" class="autocomplete" role="listbox"></div>
    </div>

    <!-- Action buttons -->
    <div class="button-row">
      <button id="sendBtn" class="btn btn-primary">Send</button>
      <button id="clearBtn" class="btn btn-secondary">Clear Overlay</button>
    </div>

    <!-- Recently sent verses (last 30, persisted in localStorage) -->
    <div class="history">
      <div class="history-header">
        <span class="history-title">Recent verses</span>
        <button id="historyClear" class="history-clear" type="button">Clear history</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </div>

    <p class="hint">
      <strong>OBS Overlay URL:</strong>
      <code id="overlayUrl">http://localhost:3000/overlay.html</code>
      <br />
      Add this as a <em>Browser Source</em> in OBS Studio (size: 1920×1080).
    </p>
  </div>

  <!-- ========================================================================= -->
  <!-- WebSocket client script                                                   -->
  <!-- ========================================================================= -->
  <script>
    (function () {
      // ---- Configuration ----------------------------------------------------
      // Change this to your server's LAN IP if you're running the overlay on
      // a different machine on the same network (see README).
      // Use wss:// on HTTPS deployments (Render/Railway) and ws:// on local http.
      const SERVER_URL = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`;

      // DOM elements
      const statusEl = document.getElementById("status");
      const inputEl = document.getElementById("textInput");
      const sendBtn = document.getElementById("sendBtn");
      const clearBtn = document.getElementById("clearBtn");
      const overlayUrlEl = document.getElementById("overlayUrl");
      const autocompleteEl = document.getElementById("autocomplete");
      const historyListEl = document.getElementById("historyList");
      const historyClearBtn = document.getElementById("historyClear");

      // ---- Bible book data --------------------------------------------------
      // Standard 66-book Protestant canon.  Each entry is the canonical name.
      const BIBLE_BOOKS = [
        "Genesis", "Exodus", "Leviticus", "Numbers", "Deuteronomy",
        "Joshua", "Judges", "Ruth", "1 Samuel", "2 Samuel",
        "1 Kings", "2 Kings", "1 Chronicles", "2 Chronicles", "Ezra",
        "Nehemiah", "Esther", "Job", "Psalms", "Proverbs",
        "Ecclesiastes", "Song of Solomon", "Isaiah", "Jeremiah", "Lamentations",
        "Ezekiel", "Daniel", "Hosea", "Joel", "Amos",
        "Obadiah", "Jonah", "Micah", "Nahum", "Habakkuk",
        "Zephaniah", "Haggai", "Zechariah", "Malachi", "Matthew",
        "Mark", "Luke", "John", "Acts", "Romans",
        "1 Corinthians", "2 Corinthians", "Galatians", "Ephesians", "Philippians",
        "Colossians", "1 Thessalonians", "2 Thessalonians", "1 Timothy", "2 Timothy",
        "Titus", "Philemon", "Hebrews", "James", "1 Peter",
        "2 Peter", "1 John", "2 John", "3 John", "Jude",
        "Revelation",

      // Verses-per-chapter for every book (KJV versification).  The Nth number

      // 66 books, 1189 chapters, 31102 verses.
      const VERSES_PER_CHAPTER = {
        "Genesis": [31,25,24,26,32,22,24,22,29,32,32,20,18,24,21,16,27,33,38,18,34,24,20,67,34,35,46,22,35,43,55,32,20,31,29,43,36,30,23,23,57,38,34,34,28,34,31,22,33,26],

        "Joshua": [18,24,17,24,15,27,26,35,27,43,23,24,33,15,63,10,18,28,51,9,45,34,16,33],
        "Judges": [36,23,31,24,31,40,25,35,57,18,40,15,25,20,20,31,13,31,30,48,25],
        "Ruth": [22,23,18,22],
        "1 Samuel": [28,36,21,22,12,21,17,22,27,27,15,25,23,52,35,23,58,30,24,42,15,23,29,22,44,25,12,25,11,31,13],
        "2 Samuel": [27,32,39,12,25,23,29,18,13,19,27,31,39,33,37,23,29,33,43,26,22,51,39,25],
        "1 Kings": [53,46,28,34,18,38,51,66,28,29,43,33,34,31,34,34,24,46,21,43,29,53],
        "2 Kings": [18,25,27,44,27,33,20,29,37,36,21,21,25,29,38,20,41,37,37,21,26,20,37,20,30],
        "1 Chronicles": [54,55,24,43,26,81,40,40,44,14,47,40,14,17,29,43,27,17,19,8,30,19,32,31,31,32,34,21,30],
        "2 Chronicles": [17,18,17,22,14,42,22,18,31,19,23,16,22,15,19,14,19,34,11,37,20,12,21,27,28,23,9,27,36,27,21,33,25,33,27,23],
        "Ezra": [11,70,13,24,17,22,28,36,15,44],
        "Nehemiah": [11,20,32,23,19,19,73,18,38,39,36,47,31],
        "Esther": [22,23,15,17,14,14,10,17,32,3],
        "Job": [22,13,26,21,27,30,21,22,35,22,20,25,28,22,35,22,16,21,29,29,34,30,17,25,6,14,23,28,25,31,40,22,33,37,16,33,24,41,30,24,34,17],
        "Psalms": [6,12,8,8,12,10,17,9,20,18,7,8,6,7,5,11,15,50,14,9,13,31,6,10,22,12,14,9,11,12,24,11,22,22,28,12,40,22,13,17,13,11,5,26,17,11,9,14,20,23,19,9,6,7,23,13,11,11,17,12,8,12,11,10,13,20,7,35,36,5,24,20,28,23,10,12,20,72,13,19,16,8,18,12,13,17,7,18,52,17,16,15,5,23,11,13,12,9,9,5,8,28,22,35,45,48,43,13,31,7,10,10,9,8,18,19,2,29,176,7,8,9,4,8,5,6,5,6,8,8,3,18,3,3,21,26,9,8,24,13,10,7,12,15,21,10,20,14,9,6],
        "Proverbs": [33,22,35,27,23,35,27,36,18,32,31,28,25,35,33,33,28,24,29,30,31,29,35,34,28,28,27,28,27,33,31],
        "Ecclesiastes": [18,26,22,16,20,12,29,17,18,20,10,14],
        "Song of Solomon": [17,17,11,16,16,13,13,14],
        "Isaiah": [31,22,26,6,30,13,25,22,21,34,16,6,22,32,9,14,14,7,25,6,17,25,18,23,12,21,13,29,24,33,9,20,24,17,10,22,38,22,8,31,29,25,28,28,25,13,15,22,26,11,23,15,12,17,13,12,21,14,21,22,11,12,19,12,25,24],
        "Jeremiah": [19,37,25,31,31,30,34,22,26,25,23,17,27,22,21,21,27,23,15,18,14,30,40,10,38,24,22,17,32,24,40,44,26,22,19,32,21,28,18,16,18,22,13,30,5,28,7,47,39,46,64,34],
        "Lamentations": [22,22,66,22,22],
        "Ezekiel": [28,10,27,17,17,14,27,18,11,22,25,28,23,23,8,63,24,32,14,49,32,31,49,27,17,21,36,26,21,26,18,32,33,31,15,38,28,23,29,49,26,20,27,31,25,24,23,35],
        "Daniel": [21,49,30,37,31,28,28,27,27,21,45,13],
        "Hosea": [11,23,5,19,15,11,16,14,17,15,12,14,16,9],
        "Joel": [20,32,21],
        "Amos": [15,16,15,13,27,14,17,14,15],
        "Obadiah": [21],
        "Jonah": [17,10,10,11],
        "Micah": [16,13,12,13,15,16,20],
        "Nahum": [15,13,19],
        "Habakkuk": [17,20,19],
        "Zephaniah": [18,15,20],
        "Haggai": [15,23],
        "Zechariah": [21,13,10,14,11,15,14,23,17,12,17,14,9,21],
        "Malachi": [14,17,18,6],
        "Matthew": [25,23,17,25,48,34,29,34,38,42,30,50,58,36,39,28,27,35,30,34,46,46,39,51,46,75,66,20],
        "Mark": [45,28,35,41,43,56,37,38,50,52,33,44,37,72,47,20],
        "Luke": [80,52,38,44,39,49,50,56,62,42,54,59,35,35,32,31,37,43,48,47,38,71,56,53],
        "John": [51,25,36,54,47,71,53,59,41,42,57,50,38,31,27,33,26,40,42,31,25],
        "Acts": [26,47,26,37,42,15,60,40,43,48,30,25,52,28,41,40,34,28,41,38,40,30,35,27,27,32,44,31],
        "Romans": [32,29,31,25,21,23,25,39,33,21,36,21,14,23,33,27],
        "1 Corinthians": [31,16,23,21,13,20,40,13,27,33,34,31,13,40,58,24],
        "2 Corinthians": [24,17,18,18,21,18,16,24,15,18,33,21,14],
        "Galatians": [24,21,29,31,26,18],
        "Ephesians": [23,22,21,32,33,24],
        "Philippians": [30,30,21,23],
        "Colossians": [29,23,25,18],
        "1 Thessalonians": [10,20,13,18,28],
        "2 Thessalonians": [12,17,18],
        "1 Timothy": [20,15,16,16,25,21],
        "2 Timothy": [18,26,17,22],
        "Titus": [16,15,15],
        "Philemon": [25],
        "Hebrews": [14,18,19,16,14,20,28,13,28,39,40,29,25],
        "James": [27,26,18,17,20],
        "1 Peter": [25,25,22,19,14],
        "2 Peter": [21,22,18],
        "1 John": [10,29,24,21,21],
        "2 John": [13],
        "3 John": [14],
        "Jude": [25],
        "Revelation": [20,29,22,11,14,17,17,13,21,11,19,17,18,20,8,21,18,24,21,15,27,21],
      };

      // Update the overlay URL shown on the page to match the current host
      overlayUrlEl.textContent = `${location.protocol}//${location.host}/overlay.html`;

      // ---- WebSocket connection ---------------------------------------------
      let socket = null;
      let reconnectTimer = null;
      let reconnectDelay = 1000; // Start at 1 s, increase on each retry

      function setStatus(state) {
        // Remove all possible status classes, then add the correct one
        statusEl.classList.remove("connected", "disconnected", "reconnecting");
        statusEl.classList.add(state);
        if (state === "connected") {
          statusEl.textContent = "Connected";
        } else if (state === "disconnected") {
          statusEl.textContent = "Disconnected";
        } else if (state === "reconnecting") {
          statusEl.textContent = "Reconnecting…";
        }
      }

      function connect() {
        // Clean up any stale socket
        if (socket) {
          socket.onclose = null; // Suppress reconnect from manual close
          socket.close();
          socket = null;
        }

        setStatus("reconnecting");
        socket = new WebSocket(SERVER_URL);

        socket.addEventListener("open", () => {
          console.log("[ws] Connected to server");
          setStatus("connected");
          reconnectDelay = 1000; // Reset backoff on successful connection
        });

        socket.addEventListener("close", () => {
          console.log("[ws] Disconnected — will retry in", reconnectDelay, "ms");
          setStatus("disconnected");
          scheduleReconnect();
        });

        socket.addEventListener("error", (err) => {
          // The 'close' event fires after 'error', so we don't need to
          // do anything here except log it.
          console.error("[ws] Error:", err);
        });
      }

      function scheduleReconnect() {
        if (reconnectTimer) return; // Already scheduled
        setStatus("reconnecting");
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          reconnectDelay = Math.min(reconnectDelay * 2, 30000); // Cap at 30 s
          connect();
        }, reconnectDelay);
      }

      // ---- Sending messages ------------------------------------------------
      function sendMessage(text) {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(text);
          console.log("[ws] Sent:", text);
        } else {
          console.warn("[ws] Cannot send — not connected");
          // Flash the status to remind the user
          statusEl.classList.add("flash");
          setTimeout(() => statusEl.classList.remove("flash"), 500);
        }
      }

      // ---- Reference autocomplete (book → chapter → verse) -----------------
      // A verse reference looks like "<book> <chapter>:<verse>", where the book
      // may carry a leading ordinal (e.g. "1 John").  We parse whichever part
      // the user is typing and suggest valid completions for that stage.
      let activeIndex = -1; // Highlighted suggestion in the dropdown (-1 = none)
      let currentMatches = []; // Suggestion objects shown in the dropdown now
      const MAX_SUGGESTIONS = 60; // Keep the dropdown from getting unwieldy

      // Break the input into { book, chapter, verse, hasColon } plus the raw
      // book text so we can tell whether the book has been fully typed yet.
      function parseRef(value) {
        const m = value.match(/^\s*([1-3]\s+)?([A-Za-z]+(?:\s+[A-Za-z]+)*)?/);
        const bookRaw = m[0];
        const bookPart = bookRaw.replace(/\s+/g, " ").trimStart();
        const rest = value.slice(bookRaw.length); // e.g. " 3:16", " 3:", " 3", ""
        const refMatch = rest.match(/^\s*(\d+)?\s*(:)?\s*(\d+)?/);
        return {
          bookPart,
          bookRaw,
          rest,
          chapter: refMatch[1] || "",
          hasColon: !!refMatch[2],
          verse: refMatch[3] || "",
          // "past the book" once any digit/colon has been typed after it
          pastBook: /[\d:]/.test(rest),
          // trailing whitespace after the book but before any number
          bookThenSpace: /^\s+$/.test(rest),
        };
      }

      // Resolve the typed book text to a canonical book name (exact, or the sole
      // prefix match) so chapter/verse counts can be looked up.
      function resolveBook(bookPart) {
        const needle = bookPart.trim().toLowerCase();
        if (!needle) return null;
        const exact = BIBLE_BOOKS.find((b) => b.toLowerCase() === needle);
        if (exact) return exact;
        const prefix = BIBLE_BOOKS.filter((b) =>
          b.toLowerCase().startsWith(needle)
        );
        return prefix.length === 1 ? prefix[0] : null;
      }

      function closeAutocomplete() {
        autocompleteEl.classList.remove("open");
        autocompleteEl.innerHTML = "";
        activeIndex = -1;
        currentMatches = [];
      }

      // Each match is { label, value }, where `value` is the full input string
      // the field becomes when the item is chosen.
      function renderAutocomplete(matches) {
        currentMatches = matches;
        activeIndex = -1;
        if (matches.length === 0) {
          closeAutocomplete();
          return;
        }
        autocompleteEl.innerHTML = "";
        matches.forEach((match) => {
          const item = document.createElement("div");
          item.className = "autocomplete-item";
          item.textContent = match.label;
          item.setAttribute("role", "option");
          // mousedown (not click) so it fires before the input loses focus/blur.
          item.addEventListener("mousedown", (e) => {
            e.preventDefault();
            chooseMatch(match);
          });
          autocompleteEl.appendChild(item);
        });
        autocompleteEl.classList.add("open");
      }

      // Apply a suggestion, then re-run so book → chapter → verse flows onward.
      function chooseMatch(match) {
        inputEl.value = match.value;
        inputEl.focus();
        inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
        updateAutocomplete(); // advance to the next stage (or close when done)
      }

      // Numbers 1..max whose decimal form starts with `typed`, as suggestions.
      function numberMatches(max, typed, buildLabel, buildValue) {
        const out = [];
        for (let n = 1; n <= max; n++) {
          if (typed === "" || String(n).startsWith(typed)) {
            out.push({ label: buildLabel(n), value: buildValue(n) });
            if (out.length >= MAX_SUGGESTIONS) break;
          }
        }
        return out;
      }

      function updateAutocomplete() {
        const value = inputEl.value;
        const ref = parseRef(value);

        // --- Stage 1: still typing the book name --------------------------
        if (!ref.pastBook && !ref.bookThenSpace) {
          const needle = ref.bookPart.trim().toLowerCase();
          if (!needle) return closeAutocomplete();
          const matches = BIBLE_BOOKS.filter((b) =>
            b.toLowerCase().startsWith(needle)
          );
          // Don't show a single suggestion the user has already fully typed.
          if (matches.length === 1 && matches[0].toLowerCase() === needle) {
            return closeAutocomplete();
          }
          return renderAutocomplete(
            matches.map((b) => ({ label: b, value: b + " " }))
          );
        }

        // Book must resolve for us to know chapter/verse counts.
        const book = resolveBook(ref.bookPart);
        if (!book) return closeAutocomplete();
        const chapters = VERSES_PER_CHAPTER[book];

        // --- Stage 3: typing the verse (a colon has been entered) ---------
        if (ref.hasColon) {
          const chapNum = parseInt(ref.chapter, 10);
          if (!chapNum || chapNum > chapters.length) return closeAutocomplete();
          const verseCount = chapters[chapNum - 1];
          const matches = numberMatches(
            verseCount,
            ref.verse,
            (v) => `${book} ${chapNum}:${v}`,
            (v) => `${book} ${chapNum}:${v}`
          );
          if (
            matches.length === 1 &&
            matches[0].label === `${book} ${chapNum}:${ref.verse}`
          ) {
            return closeAutocomplete();
          }
          return renderAutocomplete(matches);
        }

        // --- Stage 2: typing the chapter (book done, no colon yet) --------
        const matches = numberMatches(
          chapters.length,
          ref.chapter,
          (c) => `${book} ${c}`,
          (c) => `${book} ${c}:`
        );
        if (
          matches.length === 1 &&
          matches[0].label === `${book} ${ref.chapter}`
        ) {
          // Sole exact chapter — advance straight to verses by adding the colon.
          return renderAutocomplete(matches);
        }
        return renderAutocomplete(matches);
      }

      function moveActive(delta) {
        if (currentMatches.length === 0) return;
        const items = autocompleteEl.querySelectorAll(".autocomplete-item");
        if (activeIndex >= 0 && items[activeIndex]) {
          items[activeIndex].classList.remove("active");
        }
        activeIndex =
          (activeIndex + delta + currentMatches.length) % currentMatches.length;
        items[activeIndex].classList.add("active");
        items[activeIndex].scrollIntoView({ block: "nearest" });
      }

      // ---- Verse history ---------------------------------------------------
      const HISTORY_KEY = "obsOverlayVerseHistory";
      const HISTORY_LIMIT = 30;

      function loadHistory() {
        try {
          const raw = localStorage.getItem(HISTORY_KEY);
          const arr = raw ? JSON.parse(raw) : [];
          return Array.isArray(arr) ? arr : [];
        } catch (err) {
          console.warn("[history] Could not read history:", err);
          return [];
        }
      }

      function saveHistory(list) {
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
        } catch (err) {
          console.warn("[history] Could not save history:", err);
        }
      }

      // Add a sent entry to the front, de-duplicated, capped at HISTORY_LIMIT.
      function addToHistory(text) {
        const entry = text.trim();
        if (!entry) return; // Ignore empty (clear) sends
        let list = loadHistory().filter((t) => t !== entry);
        list.unshift(entry);
        list = list.slice(0, HISTORY_LIMIT);
        saveHistory(list);
        renderHistory();
      }

      function renderHistory() {
        const list = loadHistory();
        historyListEl.innerHTML = "";
        if (list.length === 0) {
          const empty = document.createElement("span");
          empty.className = "history-empty";
          empty.textContent = "No verses sent yet.";
          historyListEl.appendChild(empty);
          return;
        }
        list.forEach((text) => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "history-chip";
          chip.textContent = text;
          chip.title = "Click to load and re-send";
          chip.addEventListener("click", () => {
            inputEl.value = text;
            inputEl.focus();
            sendMessage(text);
          });
          historyListEl.appendChild(chip);
        });
      }

      // ---- Event listeners -------------------------------------------------
      inputEl.addEventListener("input", updateAutocomplete);

      inputEl.addEventListener("keydown", (e) => {
        const isOpen = autocompleteEl.classList.contains("open");

        if (isOpen && e.key === "ArrowDown") {
          e.preventDefault();
          moveActive(1);
          return;
        }
        if (isOpen && e.key === "ArrowUp") {
          e.preventDefault();
          moveActive(-1);
          return;
        }
        if (isOpen && e.key === "Escape") {
          e.preventDefault();
          closeAutocomplete();
          return;
        }
        if (e.key === "Enter") {
          e.preventDefault();
          // If a suggestion is highlighted, complete it instead of sending.
          if (isOpen && activeIndex >= 0) {
            chooseMatch(currentMatches[activeIndex]);
            return;
          }
          const text = inputEl.value;
          closeAutocomplete();
          sendMessage(text);
          addToHistory(text);
          // Keep the text in the input so the user can edit and re-send.
        }
      });

      // Close the dropdown when focus leaves the input.
      inputEl.addEventListener("blur", () => {
        // Delay so a mousedown on a suggestion can register first.
        setTimeout(closeAutocomplete, 120);
      });

      sendBtn.addEventListener("click", () => {
        closeAutocomplete();
        sendMessage(inputEl.value);
        addToHistory(inputEl.value);
      });

      clearBtn.addEventListener("click", () => {
        inputEl.value = "";
        closeAutocomplete();
        sendMessage(""); // Empty string = clear the overlay
      });

      historyClearBtn.addEventListener("click", () => {
        saveHistory([]);
        renderHistory();
      });

      // ---- Initialize ------------------------------------------------------
      renderHistory();
      connect();
    })();
